name: Build Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run backend tests
        run: go test ./...

      # glebarez/sqlite 是纯 Go 驱动，CGO_ENABLED=0 即可静态交叉编译
      - name: Build backend (linux amd64 / arm64)
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o build/codeactivityhub-server-linux-amd64 ./backend/cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" -o build/codeactivityhub-server-linux-arm64 ./backend/cmd/server

      - name: Package
        run: |
          for arch in amd64 arm64; do
            dir=build/package/codeactivityhub
            rm -rf "$dir"
            mkdir -p "$dir/frontend"
            cp "build/codeactivityhub-server-linux-$arch" "$dir/codeactivityhub-server"
            chmod +x "$dir/codeactivityhub-server"
            cp -r frontend/dist "$dir/frontend/dist"
            cp README.md codeactivityhub.service "$dir/"
            tar -czf "codeactivityhub-linux-$arch.tar.gz" -C build/package codeactivityhub
          done
          ls -la codeactivityhub-linux-*.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeactivityhub-linux
          path: |
            codeactivityhub-linux-amd64.tar.gz
            codeactivityhub-linux-arm64.tar.gz
          retention-days: 14

      - name: Attach to GitHub Release (v* 标签 → 正式版)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            codeactivityhub-linux-amd64.tar.gz
            codeactivityhub-linux-arm64.tar.gz
          generate_release_notes: true

      # 每次 push 到 main / 手动触发：覆盖更新同一个"开发构建"预发布，
      # 附件指向最新提交；正式版本号发布仍走上面的标签分支
      - name: Update 开发构建 Release (main push / 手动)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: 开发构建（main 最新）
          prerelease: true
          overwrite_files: true
          files: |
            codeactivityhub-linux-amd64.tar.gz
            codeactivityhub-linux-arm64.tar.gz
          body: |
            main 分支最新自动构建（提交 ${{ github.sha }}），每次 push 覆盖更新。
            正式版本请选择带版本号的 Release。

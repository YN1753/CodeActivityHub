<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeActivityHub</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script type="module" src="/src/main.js"></script>
</head>
<body class="antialiased">
  <div id="app" v-cloak>

    <!-- 连接中 -->
    <div v-if="isAuthChecking" class="min-h-screen flex items-center justify-center text-sm text-slate-500">
      正在连接…
    </div>

    <!-- ================= 未登录 ================= -->
    <div v-else-if="!isLoggedIn" class="min-h-screen flex items-center justify-center px-4">
      <div class="w-full max-w-sm">
        <div class="text-center mb-6">
          <h1 class="text-xl font-semibold tracking-tight">CodeActivityHub</h1>
          <p class="text-sm text-slate-500 mt-1">跨平台刷题数据看板</p>
        </div>
        <div class="ui-card p-6">
          <div class="flex gap-1 p-1 rounded-lg bg-slate-100 mb-5">
            <button type="button" @click="authMode = 'login'; authError = ''"
                    :class="['flex-1 py-1.5 rounded-md text-sm font-medium transition-colors',
                             authMode === 'login' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800']">登录</button>
            <button type="button" @click="authMode = 'register'; authError = ''"
                    :class="['flex-1 py-1.5 rounded-md text-sm font-medium transition-colors',
                             authMode === 'register' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800']">注册</button>
          </div>

          <div v-if="authError" class="mb-4 px-3 py-2 rounded-lg bg-rose-50 border border-rose-200 text-xs text-rose-700">{{ authError }}</div>

          <form @submit.prevent="authMode === 'login' ? handleLogin() : handleRegister()" class="space-y-4">
            <div>
              <label class="block text-xs text-slate-500 mb-1.5">用户名</label>
              <input v-model="authForm.username" type="text" required placeholder="3-32 位" class="ui-input font-mono">
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1.5">密码</label>
              <input v-model="authForm.password" type="password" required placeholder="至少 6 位" class="ui-input font-mono">
            </div>
            <div v-if="authMode === 'register'">
              <label class="block text-xs text-slate-500 mb-1.5">确认密码</label>
              <input v-model="authForm.confirmPassword" type="password" required class="ui-input font-mono">
            </div>
            <button type="submit" :disabled="isAuthLoading" class="btn-primary w-full">
              {{ isAuthLoading ? '处理中…' : (authMode === 'login' ? '登录' : '注册') }}
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- ================= 已登录 ================= -->
    <template v-if="isLoggedIn">

      <!-- 顶栏：品牌 + 导航 + 状态 -->
      <header class="sticky top-0 z-30 bg-white border-b border-slate-200">
        <div class="max-w-[1400px] mx-auto px-6 h-14 flex items-center gap-5">
          <div class="font-semibold tracking-tight shrink-0">CodeActivityHub</div>

          <nav class="flex items-center gap-1 overflow-x-auto">
            <button v-for="t in [['overview','数据总览'],['contests','比赛日历'],['problems','题库'],
                                ['submissions','提交记录'],['mistakes','错题集']]"
                    :key="t[0]" @click="currentTab = t[0]"
                    :class="['px-3 py-1.5 rounded-lg text-sm whitespace-nowrap transition-colors',
                             currentTab === t[0] ? 'bg-slate-900 text-white font-medium'
                                                 : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100']">
              {{ t[1] }}<span v-if="t[0]==='mistakes' && mistakes.length"
                              class="ml-1.5 text-[10px] font-mono opacity-70">{{ mistakes.length }}</span>
            </button>
          </nav>

          <div class="ml-auto flex items-center gap-4 shrink-0">
            <!-- 平台状态 -->
            <div class="hidden lg:flex items-center gap-3 text-[11px] font-mono text-slate-500">
              <span class="flex items-center gap-1"><span :class="['dot', 'dot-' + getStatusClass('codeforces')]"></span>CF {{ overview.stats.platforms?.codeforces?.ac || 0 }}</span>
              <span class="flex items-center gap-1"><span :class="['dot', 'dot-' + getStatusClass('atcoder')]"></span>AT {{ overview.stats.platforms?.atcoder?.ac || 0 }}</span>
              <span class="flex items-center gap-1"><span :class="['dot', 'dot-' + getStatusClass('luogu')]"></span>LG {{ overview.stats.platforms?.luogu?.ac || 0 }}</span>
              <span class="flex items-center gap-1"><span :class="['dot', 'dot-' + getStatusClass('acwing')]"></span>AW {{ overview.stats.platforms?.acwing?.ac || 0 }}</span>
            </div>

            <button @click="syncNow('all')" :disabled="isSyncing" class="btn-primary h-8 px-3 flex items-center gap-1.5">
              <svg :class="['w-3.5 h-3.5', isSyncing ? 'animate-spin' : '']" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
              </svg>
              {{ isSyncing ? '同步中' : '刷新' }}
            </button>

            <div class="relative pl-3 border-l border-slate-200">
              <button @click="toggleUserMenu"
                      class="flex items-center gap-2 rounded-lg px-1.5 py-1 hover:bg-slate-100 transition-colors">
                <span class="w-6 h-6 rounded-full bg-slate-900 text-white text-[11px] font-semibold flex items-center justify-center">
                  {{ (currentUser?.username || '?').slice(0, 1).toUpperCase() }}
                </span>
                <span class="text-sm text-slate-700 hidden md:inline">{{ currentUser?.username }}</span>
                <svg class="w-3 h-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </button>

              <!-- 点击其它区域关闭 -->
              <div v-if="userMenuOpen" class="fixed inset-0 z-40" @click="closeUserMenu"></div>
              <div v-if="userMenuOpen" class="absolute right-0 top-full mt-2 w-44 ui-card p-1.5 z-50 shadow-lg">
                <button @click="closeUserMenu(); currentTab = 'settings'"
                        class="w-full text-left px-3 py-2 rounded-md text-sm text-slate-700 hover:bg-slate-100 flex items-center gap-2">
                  <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  </svg>
                  系统设置
                </button>
                <button @click="handleLogout"
                        class="w-full text-left px-3 py-2 rounded-md text-sm text-rose-700 hover:bg-rose-50 flex items-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                  </svg>
                  退出登录
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="max-w-[1400px] mx-auto px-6 py-6">
        <!-- 告警条 -->
        <div v-if="warningBanner" class="mb-6 px-4 py-3 rounded-lg bg-rose-50 border border-rose-200 flex items-start justify-between gap-4">
          <div class="text-xs text-rose-800 leading-relaxed">{{ warningBanner }}</div>
          <button @click="currentTab = 'settings'" class="text-xs text-rose-700 underline shrink-0">前往设置</button>
        </div>

        <!-- ============ 数据总览 ============ -->
        <div v-show="currentTab === 'overview'" class="space-y-6">
          <!-- 顶部四张卡：今日推进度 / 连续打卡（近 7 天趋势条）/ 近 7 天 / 累计通过 -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- ① 今日：通过 / 尝试 题数 + 进度条 -->
            <div class="ui-card p-5 flex flex-col">
              <div class="flex items-center justify-between">
                <span class="text-xs text-slate-500">今日</span>
                <span class="text-[11px] text-slate-400">{{ todayStats.attempted ? '已推进 ' + todayStats.rate + '%' : '还没开始' }}</span>
              </div>
              <div class="mt-2 flex items-baseline gap-1.5">
                <span class="text-3xl font-semibold tabular-nums">{{ todayStats.solved }}</span>
                <span class="text-base text-slate-300">/</span>
                <span class="text-lg text-slate-500 tabular-nums">{{ todayStats.attempted }}</span>
                <span class="text-[11px] text-slate-400 ml-0.5">通过 / 尝试</span>
              </div>
              <div class="mt-3 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                <div class="h-full rounded-full bg-blue-500 transition-all duration-500"
                     :style="{ width: todayStats.rate + '%' }"></div>
              </div>
              <div class="mt-auto pt-3 text-[11px] text-slate-400">
                <span v-if="todayStats.subs">提交 {{ todayStats.subs }} 次</span>
                <span v-else>今天还没有提交</span>
                <span v-if="todayStats.attempted > todayStats.solved"> · 还有 {{ todayStats.attempted - todayStats.solved }} 题待攻克</span>
                <span v-else-if="todayStats.attempted"> · 今日全部通过</span>
              </div>
            </div>

            <!-- ② 连续打卡：天数 + 近 7 天迷你趋势条 -->
            <div class="ui-card p-5 flex flex-col">
              <div class="flex items-center justify-between">
                <span class="text-xs text-slate-500">连续打卡</span>
                <span class="text-[11px] text-slate-400">{{ overview.stats.streak > 0 ? '保持中' : '从今天开始' }}</span>
              </div>
              <div class="mt-2 flex items-baseline gap-1">
                <span class="text-3xl font-semibold tabular-nums">{{ overview.stats.streak || 0 }}</span>
                <span class="text-sm text-slate-400">天</span>
              </div>
              <div class="mt-auto pt-3">
                <div ref="streakWrap" class="relative">
                  <div class="flex items-end gap-1 h-8" @mouseleave="hideMiniTip">
                    <div v-for="d in weekStats.days" :key="d.date"
                         class="flex-1 rounded-t-[3px] cursor-default"
                         :class="d.solved ? 'bg-blue-500/85' : 'bg-slate-200'"
                         :style="{ height: (d.solved ? Math.min(8 + d.solved * 7, 32) : 3) + 'px' }"
                         @mouseenter="showStreakTip($event, d)"
                         @mousemove="showStreakTip($event, d)"></div>
                  </div>
                  <div class="mt-1 flex gap-1">
                    <span v-for="d in weekStats.days" :key="d.date + '-label'"
                          class="flex-1 text-center text-[10px] text-slate-400 leading-none">{{ d.date.slice(8) }}</span>
                  </div>
                  <!-- 悬浮浮层：与下方 ECharts tooltip 同规格（白底 + 细边 + 圆角 + 阴影 + 等宽小字） -->
                  <div v-if="miniTip && miniTip.card === 'streak'"
                       class="pointer-events-none absolute z-30 whitespace-nowrap rounded-lg border border-slate-200 bg-white px-3 py-2 shadow-[0_4px_16px_rgba(16,24,40,0.12)]"
                       :style="{ left: miniTip.x + 'px', top: miniTip.y + 'px', transform: 'translate(-50%, -100%)' }">
                    <div class="font-mono text-xs font-semibold text-slate-900">{{ miniTip.date }} {{ weekdayOf(miniTip.date) }}</div>
                    <div class="font-mono text-xs mt-1">
                      <span v-if="miniTip.solved" class="text-blue-600 font-bold">通过 {{ miniTip.solved }} 题</span>
                      <span v-else class="text-slate-400">没有通过</span>
                      <span class="text-slate-400"> · 提交 {{ miniTip.subs }} 次</span>
                    </div>
                    <span class="absolute left-1/2 -bottom-[5px] h-2 w-2 -translate-x-1/2 rotate-45 border-b border-r border-slate-200 bg-white"></span>
                  </div>
                </div>
              </div>
            </div>

            <!-- ③ 近 7 天汇总 -->
            <div class="ui-card p-5 flex flex-col">
              <div class="flex items-center justify-between">
                <span class="text-xs text-slate-500">近 7 天</span>
                <span class="text-[11px] text-slate-400">{{ weekStats.active }} 天有产出</span>
              </div>
              <div class="mt-2 flex items-baseline gap-1">
                <span class="text-3xl font-semibold tabular-nums">{{ weekStats.solved }}</span>
                <span class="text-sm text-slate-400">题通过</span>
              </div>
              <div class="mt-3 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                <div class="h-full rounded-full bg-blue-500/70 transition-all duration-500"
                     :style="{ width: (weekStats.days.length ? Math.round(weekStats.active / weekStats.days.length * 100) : 0) + '%' }"></div>
              </div>
              <div class="mt-auto pt-3 text-[11px] text-slate-400 flex flex-wrap gap-x-3">
                <span>提交 {{ weekStats.subs }} 次</span>
                <span>单日最好 {{ weekStats.best }} 题</span>
              </div>
            </div>

            <!-- ④ 累计通过 + 平台分布 -->
            <div class="ui-card p-5 flex flex-col">
              <div class="flex items-center justify-between">
                <span class="text-xs text-slate-500">累计通过</span>
                <span class="text-[11px] text-slate-400 truncate" :title="overview.last_sync_time">
                  {{ overview.last_sync_time ? '同步 ' + formatTimeAgo(overview.last_sync_time) : '暂无同步' }}
                </span>
              </div>
              <div class="mt-2 flex items-baseline gap-1">
                <span class="text-3xl font-semibold tabular-nums">{{ overview.stats.total_ac || 0 }}</span>
                <span class="text-sm text-slate-400">题</span>
              </div>
              <div ref="platformWrap" class="relative mt-3">
                <div class="h-1.5 rounded-full bg-slate-100 overflow-hidden flex" @mouseleave="hideMiniTip">
                  <div v-for="p in [['codeforces','CF','Codeforces','bg-blue-500'],['luogu','LG','洛谷','bg-sky-500'],['atcoder','AT','AtCoder','bg-purple-500'],['acwing','AW','AcWing','bg-indigo-500']]"
                       :key="p[0]"
                       :class="p[3]"
                       class="cursor-default"
                       :style="{ width: (overview.stats.total_ac ? Math.round((overview.stats.platforms?.[p[0]]?.ac || 0) / overview.stats.total_ac * 100) : 0) + '%' }"
                       @mouseenter="showPlatformTip($event, p)"
                       @mousemove="showPlatformTip($event, p)"></div>
                </div>
                <div v-if="miniTip && miniTip.card === 'platform'"
                     class="pointer-events-none absolute z-30 whitespace-nowrap rounded-lg border border-slate-200 bg-white px-3 py-2 shadow-[0_4px_16px_rgba(16,24,40,0.12)]"
                     :style="{ left: miniTip.x + 'px', top: miniTip.y + 'px', transform: 'translate(-50%, -100%)' }">
                  <div class="font-mono text-xs font-semibold text-slate-900">{{ miniTip.label }}</div>
                  <div class="font-mono text-xs mt-1">
                    <span class="text-blue-600 font-bold">{{ miniTip.ac }} 题</span>
                    <span class="text-slate-400"> · 占 {{ miniTip.pct }}%</span>
                  </div>
                  <span class="absolute left-1/2 -bottom-[5px] h-2 w-2 -translate-x-1/2 rotate-45 border-b border-r border-slate-200 bg-white"></span>
                </div>
              </div>
              <div class="mt-auto pt-3 flex flex-wrap gap-x-3 gap-y-1 text-[11px] font-mono text-slate-500">
                <span v-for="p in [['codeforces','CF'],['luogu','LG'],['atcoder','AT'],['acwing','AW']]" :key="p[0]"
                      class="flex items-center gap-1">
                  <span :class="['dot', 'dot-' + getStatusClass(p[0])]"></span>{{ p[1] }} {{ overview.stats.platforms?.[p[0]]?.ac || 0 }}
                </span>
              </div>
            </div>
          </div>

          <!-- 热力图 -->
          <div class="ui-card p-5">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <h2 class="text-sm font-semibold">刷题热力图</h2>
              <div class="flex flex-wrap items-center gap-2">
                <ui-select v-if="availableHeatmapYears.length > 1" dense
                           :model-value="selectedHeatmapYear"
                           :options="heatmapYearOptions"
                           @update:model-value="setHeatmapYear"></ui-select>
                <span v-else class="pill pill-muted">{{ selectedHeatmapYear }} 年</span>
                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
                  <button v-for="p in [['all','全部'],['codeforces','CF'],['leetcode','LC'],['atcoder','AT'],['luogu','LG'],['acwing','AW']]"
                          :key="p[0]" @click="setHeatmapFilter(p[0])"
                          :class="['px-2 py-0.5 rounded-md text-[11px] font-medium transition-colors',
                                   heatmapFilter === p[0] ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800']">{{ p[1] }}</button>
                </div>
              </div>
            </div>
            <div class="w-full overflow-x-auto">
              <div id="heatmap-chart" class="w-full min-w-[760px] h-40"></div>
            </div>
            <div class="flex items-center justify-between pt-3 mt-1 border-t border-slate-100">
              <span class="ui-hint">{{ selectedHeatmapYear }} 年度提交分布</span>
              <div class="flex items-center gap-1.5 text-[10px] text-slate-400">
                少
                <span class="w-3 h-3 rounded-[3px] bg-[#bfdbfe]"></span>
                <span class="w-3 h-3 rounded-[3px] bg-[#93c5fd]"></span>
                <span class="w-3 h-3 rounded-[3px] bg-[#60a5fa]"></span>
                <span class="w-3 h-3 rounded-[3px] bg-[#3b82f6]"></span>
                <span class="w-3 h-3 rounded-[3px] bg-[#2563eb]"></span>
                多
              </div>
            </div>
          </div>

          <!-- 图表 -->
          <div class="grid lg:grid-cols-2 gap-4">
            <div class="ui-card p-5">
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold">知识点分布</h2>
                <span class="ui-hint">按通过题数</span>
              </div>
              <div id="tag-bar-chart" class="w-full h-64"></div>
            </div>
            <div class="ui-card p-5">
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold">平台占比</h2>
                <span class="ui-hint">按通过题数</span>
              </div>
              <div id="platform-pie-chart" class="w-full h-64"></div>
            </div>
          </div>

          <!-- 近期比赛 -->
          <div v-if="topUpcomingContests.length > 0" class="ui-card p-5">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-sm font-semibold">近期比赛 <span class="text-slate-400 font-normal">· {{ upcomingContestsCount }} 场待开赛</span></h2>
              <button @click="currentTab = 'contests'" class="text-xs text-blue-600 hover:underline">查看全部</button>
            </div>
            <div class="grid md:grid-cols-3 gap-3">
              <a v-for="c in topUpcomingContests" :key="c.id" :href="c.url" target="_blank" rel="noopener noreferrer"
                 class="block p-4 rounded-lg border border-slate-200 hover:border-blue-300 hover:bg-slate-50 transition-colors">
                <div class="flex items-center justify-between mb-2">
                  <span class="pill pill-muted">{{ c.platform }}</span>
                  <span class="ui-hint">{{ (c.start_time || '').slice(5, 16) }}</span>
                </div>
                <div class="text-sm font-medium text-slate-900 line-clamp-2" :title="c.name">{{ c.name }}</div>
                <div class="mt-2 text-xs" :class="getContestStatus(c) === 'CODING' ? 'text-rose-700 font-medium' : 'text-blue-600'">
                  {{ formatContestCountdown(c) }}
                </div>
              </a>
            </div>
          </div>
        </div>

        <!-- ============ 比赛日历 ============ -->
        <div v-show="currentTab === 'contests'" class="space-y-6">
          <!-- 工具条：平台筛选 + 搜索 + 刷新（状态筛选由下方分组取代） -->
          <div class="ui-card p-4 flex flex-wrap items-center gap-2">
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
              <button v-for="f in [['all','全部'],['codeforces','Codeforces'],['atcoder','AtCoder'],['luogu','洛谷']]" :key="f[0]"
                      @click="contestFilter = f[0]"
                      :class="['px-2.5 py-1 rounded-md text-xs font-medium transition-colors',
                               contestFilter === f[0] ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-800']">{{ f[1] }}</button>
            </div>
            <input v-model="contestSearch" type="text" placeholder="搜索比赛…" class="ui-input w-auto flex-1 min-w-[160px]">
            <button @click="syncContestsNow" :disabled="isSyncingContests" class="btn-secondary shrink-0">
              {{ isSyncingContests ? '刷新中…' : '刷新比赛' }}
            </button>
          </div>

          <!-- 空状态 -->
          <div v-if="!liveContests.length && !upcomingContests.length && !pastContests.length" class="ui-card p-12 text-center">
            <p class="text-sm text-slate-500">没有匹配的比赛</p>
            <p class="ui-hint mt-1">点右上角「刷新比赛」从各平台拉取最新赛程</p>

                </div>

                  <template v-if="formatCountdownTo(c).d > 0">
                    <span class="text-lg font-semibold">{{ formatCountdownTo(c).d }}</span><span class="text-[11px] text-slate-400 font-sans mr-0.5">天</span>
                  </template>
                  <span class="text-lg font-semibold">{{ formatCountdownTo(c).h }}:{{ formatCountdownTo(c).m }}:{{ formatCountdownTo(c).s }}</span>

                </div>

            </div>
            <button v-if="upcomingContests.length > shownUpcomingContests.length" @click="showAllUpcoming = true"

                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path>

                </svg>

                </svg>

              </div>

                <svg class="w-8 h-8 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"></path>

                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"></path>
                </svg>

              </button>
            </div>
          </div>

                    <td colspan="6" class="py-14">

                        <svg class="w-8 h-8 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>

                                       item.platform === 'atcoder' ? 'bg-purple-50 text-purple-700 border-purple-200' :
                                       item.platform === 'luogu' ? 'bg-sky-50 text-sky-700 border-sky-200' :
                                       'bg-indigo-50 text-indigo-700 border-indigo-200']">{{ platformBadge(item.platform) }}</span>

                          <span class="font-mono text-xs text-slate-400 mr-1">{{ item.problem_id }}</span>{{ item.problem_title }}
                        </a>
                        <span v-else><span class="font-mono text-xs text-slate-400 mr-1">{{ item.problem_id }}</span>{{ item.problem_title }}</span>
                      </div>

                    <td><span :class="['pill', verdictPillClass(item.verdict)]">{{ item.verdict || 'UNKNOWN' }}</span></td>

        <!-- ============ 系统设置 ============ -->

        <div v-show="currentTab === 'settings'" class="space-y-5">
          <div>
            <h1 class="text-lg font-semibold text-slate-900">系统设置</h1>
            <p class="ui-hint mt-0.5">平台账号、脚本接入、数据同步与账号安全</p>

          <div class="grid lg:grid-cols-[210px_minmax(0,1fr)] gap-6 items-start">

                    <p class="text-slate-500">填了 Cookie 的平台才能同步历史提交记录；不填也能校验账号，只是同步不到记录。</p>

                          </tr>
                          <tr>
                            <td class="py-1 pr-4">AtCoder</td>

                          </tr>
                          <tr>
                            <td class="py-1 pr-4">洛谷</td>
                            <td class="py-1 pr-4">纯数字 UID</td>

                          <tr>

                <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
                  <div v-for="(meta, key) in platformMeta" :key="key" class="ui-card p-4 space-y-3">

                      <div class="min-w-0">
                        <div class="flex items-center gap-2">
                          <span class="w-2 h-2 rounded-full" :class="meta.dot"></span>
                          <span class="text-sm font-semibold">{{ meta.label }}</span>
                        </div>
                        <div class="ui-hint mt-0.5">{{ accountsFor(key).length }} 个账号</div>
                      </div>
                      <button @click="syncPlatformRecords(key)"
                              :disabled="syncingPlatform[key] || accountsFor(key).length === 0 || meta.canSync === false"
                              :title="meta.canSync === false ? meta.label + ' 没有公开的历史记录接口，提交记录请用浏览器脚本接入' : '从 ' + meta.label + ' 拉取历史提交记录（浏览器脚本只负责实时推送）'"
                              class="px-2 py-0.5 rounded text-[11px] border border-slate-200 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed shrink-0">
                        {{ syncingPlatform[key] ? '同步中…' : '同步记录' }}
                      </button>
                    </div>

                    <div class="space-y-2">
                      <div v-for="acc in accountsFor(key)" :key="acc.id"
                           :class="['p-2.5 rounded-lg border text-xs space-y-1',
                                    acc.selected ? 'bg-blue-50/60 border-blue-200' : 'bg-slate-50 border-slate-200']">
                        <!-- 编辑态：就地改备注名 / 用户名 / Cookie -->
                        <template v-if="editingAccountId === acc.id">
                          <input v-model="editAccountForm.name" type="text" placeholder="备注名（可选）" class="ui-input text-xs py-1">
                          <input v-model="editAccountForm.handle" type="text" :placeholder="meta.handlePlaceholder" class="ui-input font-mono text-xs py-1">
                          <input v-if="meta.cookie" v-model="editAccountForm.cookie" type="text" :placeholder="meta.cookiePlaceholder" class="ui-input font-mono text-xs py-1">
                          <div v-if="meta.cookie" class="text-[11px] text-slate-400">Cookie 留空＝保持原值</div>
                          <div class="flex flex-wrap gap-2 pt-0.5">
                            <button @click="saveEditAccount(acc, true)" class="btn-primary py-1 px-2 text-[11px]">保存并验证</button>
                            <button @click="saveEditAccount(acc, false)" class="btn-secondary py-1 px-2 text-[11px]">仅保存</button>
                            <button @click="cancelEditAccount" class="px-2 py-1 rounded text-[11px] border border-slate-200 hover:bg-slate-100">取消</button>
                          </div>
                        </template>

                        <!-- 展示态 -->
                        <template v-else>
                          <div class="flex items-center justify-between gap-2">
                            <label class="flex items-center gap-2 cursor-pointer min-w-0">
                              <input type="radio" :name="'account-' + key" :checked="acc.selected" @change="selectAccount(acc.id)" class="accent-blue-600">
                              <span class="truncate font-medium" :class="acc.selected ? 'text-blue-700' : 'text-slate-700'">{{ acc.name }}</span>
                            </label>
                            <div class="flex items-center gap-1 shrink-0">
                              <button @click="startEditAccount(acc)"
                                      class="px-2 py-0.5 rounded text-[11px] border border-slate-200 hover:bg-slate-100">编辑</button>
                              <button @click="verifyAccount(acc.id)" :disabled="isVerifyingAccount[acc.id]"
                                      class="px-2 py-0.5 rounded text-[11px] border border-slate-200 hover:bg-slate-100 disabled:opacity-50">
                                {{ isVerifyingAccount[acc.id] ? '验证中' : '验证' }}
                              </button>
                              <button @click="deleteAccount(acc.id)"
                                      class="px-2 py-0.5 rounded text-[11px] text-rose-700 bg-rose-50 border border-rose-200 hover:bg-rose-100">删除</button>
                            </div>
                          </div>
                          <div class="flex items-center justify-between gap-2 font-mono text-[11px] text-slate-400">
                            <span class="truncate">{{ acc.handle }}</span>
                            <span>{{ acc.cookie_hint }}</span>
                          </div>
                          <div v-if="acc.message" class="text-[11px] truncate"
                               :class="acc.status === 'ok' ? 'text-emerald-700' : acc.status === 'error' ? 'text-rose-700' : 'text-slate-400'"
                               :title="acc.message">{{ acc.selected ? '● 启用中 · ' : '' }}{{ acc.message }}</div>
                        </template>
                      </div>
                      <div v-if="accountsFor(key).length === 0" class="text-xs text-slate-400">尚未保存账号</div>
                    </div>

                    <!-- 添加账号默认收起，减少卡片噪音 -->
                    <div class="pt-3 border-t border-slate-100">
                      <button v-if="addingPlatform !== key" @click="addingPlatform = key"
                              class="text-xs text-blue-700 hover:text-blue-800">+ 添加账号</button>
                      <div v-else class="space-y-2">
                        <input v-model="accountForms[key].name" type="text" placeholder="备注名（可选）" class="ui-input text-xs py-1.5">
                        <input v-model="accountForms[key].handle" type="text" :placeholder="meta.handlePlaceholder" class="ui-input font-mono text-xs py-1.5">
                        <input v-if="meta.cookie" v-model="accountForms[key].cookie" type="text" :placeholder="meta.cookiePlaceholder" class="ui-input font-mono text-xs py-1.5">
                        <div class="flex gap-2">
                          <button @click="addAccount(key, true)" class="btn-primary flex-1 py-1.5 text-xs">保存并验证</button>
                          <button @click="addAccount(key, false)" class="btn-secondary py-1.5 text-xs">仅保存</button>
                          <button @click="addingPlatform = ''" class="px-2 py-1.5 rounded text-xs border border-slate-200 hover:bg-slate-100">取消</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <!-- ② 脚本接入 -->
              <section v-show="settingsTab === 'script'" class="space-y-4">
                <div class="flex items-baseline justify-between gap-3">
                  <h2 class="text-sm font-semibold">浏览器脚本 Token</h2>
                  <button @click="createIngestToken" :disabled="isIssuingToken" class="btn-primary text-xs">
                    {{ isIssuingToken ? '生成中…' : '生成新 Token' }}
                  </button>
                </div>
                <div class="ui-card p-4 space-y-3">
                  <p class="ui-hint">
                    Token 独立于登录会话、长期有效，只用于提交记录接入（其他接口返回 403）。
                    明文只在生成或轮换时显示一次，之后仅能看到提示与最后使用时间。
                  </p>
                  <div v-if="freshToken" class="p-3 rounded-lg bg-amber-50 border border-amber-200 space-y-2">
                    <div class="text-xs font-medium text-amber-800">「{{ freshTokenName }}」的新 Token —— 只显示这一次，请立即复制</div>
                    <div class="flex flex-col sm:flex-row gap-2">
                      <input :value="freshToken" readonly @focus="$event.target.select()" class="ui-input font-mono text-xs flex-1">
                      <button @click="copyFreshToken" class="btn-primary text-xs whitespace-nowrap">复制</button>
                      <button @click="dismissFreshToken" class="btn-secondary text-xs whitespace-nowrap">我已保存</button>
                    </div>
                  </div>

                  <div class="space-y-1.5">
                    <div v-for="tk in ingestTokens" :key="tk.id"
                         :class="['p-2.5 rounded-lg border flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs',
                                  isTokenActive(tk) ? 'border-slate-200 bg-slate-50' : 'border-slate-200 opacity-60']">
                      <div class="min-w-0">
                        <div class="flex items-center gap-2">
                          <span class="font-medium" :class="isTokenActive(tk) ? 'text-slate-900' : 'text-slate-400'">{{ tk.name }}</span>
                          <span :class="['pill', isTokenActive(tk) ? 'pill-ok' : 'pill-error']">{{ isTokenActive(tk) ? '生效中' : '已吊销' }}</span>
                        </div>
                        <div class="font-mono text-[11px] text-slate-400 mt-0.5">
                          {{ tk.token_hint }}•••• · 创建 {{ (tk.created_at || '').slice(0, 10) }} · 最后使用 {{ tk.last_used_at ? formatTimeAgo(tk.last_used_at) : '从未使用' }}
                        </div>
                      </div>
                      <div v-if="isTokenActive(tk)" class="flex gap-1.5 shrink-0">
                        <button @click="rotateIngestToken(tk)" :disabled="tokenActionId === tk.id" class="btn-secondary text-[11px] py-1">轮换</button>
                        <button @click="revokeIngestToken(tk)" :disabled="tokenActionId === tk.id" class="px-2 py-1 rounded text-[11px] text-rose-700 bg-rose-50 border border-rose-200 hover:bg-rose-100 disabled:opacity-50">吊销</button>
                      </div>
                    </div>
                    <div v-if="ingestTokens.length === 0" class="text-xs text-slate-400">还没有 Token，点右上角「生成新 Token」。</div>
                  </div>
                </div>
              </section>

              <!-- ③ 数据与同步 -->
              <section v-show="settingsTab === 'data'" class="space-y-4">
                <h2 class="text-sm font-semibold">数据与同步</h2>
                <div class="ui-card p-4 space-y-2">
                  <div class="text-xs font-semibold text-slate-900">数据来源</div>
                  <p class="ui-hint">看板不在后台轮询：历史数据在你点击「刷新」或某个平台的「同步记录」时，通过各平台公开接口（或你填的 Cookie）读取；提交后的即时结果由长效 Token + 浏览器脚本推送。</p>
                  <p class="ui-hint">平台凭证只保存在本地数据库，只用于以你的身份向对应平台读取提交记录，不会发送给其他站点。</p>
                  <div class="pt-3 flex justify-end border-t border-slate-100">
                    <button @click="saveSettingsAndSync" :disabled="isSaving" class="btn-primary text-xs">
                      {{ isSaving ? '正在保存并同步…' : '保存并同步' }}
                    </button>
                  </div>
                </div>
              </section>

              <!-- ④ 账号安全 -->
              <section v-show="settingsTab === 'security'" class="space-y-4">
                <h2 class="text-sm font-semibold">账号安全</h2>
                <div class="ui-card p-4 space-y-3 max-w-xl">
                  <div class="text-xs font-semibold text-slate-900">修改登录密码</div>
                  <div class="space-y-2">
                    <input v-model="pwdForm.oldPassword" type="password" placeholder="原密码" class="ui-input font-mono">
                    <div class="grid sm:grid-cols-2 gap-2">
                      <input v-model="pwdForm.newPassword" type="password" placeholder="新密码（至少 6 位）" class="ui-input font-mono">
                      <input v-model="pwdForm.confirmNewPassword" type="password" placeholder="再次输入新密码" class="ui-input font-mono">
                    </div>
                  </div>
                  <div class="flex items-center justify-between gap-3">
                    <p class="ui-hint">修改成功后所有登录会话与脚本 Token 都会被吊销。</p>
                    <button @click="handleChangePassword" :disabled="isChangingPwd" class="btn-secondary text-xs shrink-0">
                      {{ isChangingPwd ? '正在修改…' : '确认修改' }}
                    </button>
                  </div>
                </div>
              </section>

            </div>
          </div>
        </div>

      </main>
    </template>

    <!-- 全局提示 -->
    <div v-if="toast.show"
         class="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-lg shadow-lg border text-sm font-medium flex items-center gap-2"
         :class="toastClass">
      <span>{{ toastIcon }}</span><span>{{ toast.message }}</span>
    </div>
  </div>

  <!-- ui-select 组件模板：与 ui-card 同风格的实色下拉，替代原生 select 的系统弹层 -->
  <script type="text/x-template" id="ui-select-tpl">
    <div ref="root" class="relative inline-block">
      <button type="button" ref="trigger" :disabled="disabled"
              @click="toggle" @keydown="onKeydown"
              aria-haspopup="listbox" :aria-expanded="open ? 'true' : 'false'"
              :class="['ui-input w-auto flex items-center justify-between gap-2 text-left',
                       dense ? 'py-1 text-xs' : 'text-xs']">
        <span class="truncate" :class="currentOption ? '' : 'text-slate-400'">{{ currentLabel }}</span>
        <svg :class="['w-3 h-3 shrink-0 text-slate-400 transition-transform', open ? 'rotate-180' : '']"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <div v-if="open" ref="popup" role="listbox"
           :class="['absolute z-50 mt-1 ui-card p-1.5 shadow-lg min-w-full max-h-60 overflow-y-auto',
                    dropUp ? 'bottom-full mb-1' : 'top-full',
                    alignRight ? 'right-0' : 'left-0']">
        <button v-for="(o, i) in options" :key="o.value" type="button" role="option"
                :data-index="i" :aria-selected="o.value === modelValue ? 'true' : 'false'"
                @click="choose(o)" @mouseenter="highlight = i"
                :class="['w-full text-left px-3 py-2 rounded-md text-xs flex items-center justify-between gap-2 whitespace-nowrap',
                         i === highlight ? 'bg-slate-100' : '',
                         o.value === modelValue ? 'text-blue-600 font-medium' : 'text-slate-700']">
          <span class="truncate">{{ o.label }}</span>
          <svg v-if="o.value === modelValue" class="w-3.5 h-3.5 shrink-0 text-blue-600"
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </button>
      </div>
    </div>
  </script>
</body>
</html>
